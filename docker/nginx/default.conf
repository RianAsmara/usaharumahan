# Single server block handles every hostname: the root domain (dashboard,
# platform admin, auth), every tenant subdomain, and any verified custom
# domain. Laravel resolves the tenant from the Host header itself — see
# docs/TENANCY.md. This is why server_name is a wildcard rather than one
# entry per tenant: tenants are added at runtime, not at deploy time.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 12M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;

        # Laravel's font-preload Link headers (AddLinkHeadersForPreloadedAssets)
        # plus session/XSRF-TOKEN cookies routinely exceed nginx's tiny default
        # FastCGI header buffer (~4-8k), causing an intermittent 502 "upstream
        # sent too big header" on otherwise-working pages.
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
