name: usaharumahan

x-app-image: &app-image
  build:
    context: .
    target: development
  volumes:
    - .:/var/www/html
  environment:
    - PHP_IDE_CONFIG=serverName=usaharumahan
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app-image
    container_name: usaharumahan-app

  nginx:
    image: nginx:1.27-alpine
    container_name: usaharumahan-nginx
    ports:
      - "8180:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 5

  vite:
    <<: *app-image
    container_name: usaharumahan-vite
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"

  horizon:
    <<: *app-image
    container_name: usaharumahan-horizon
    command: php artisan horizon
    restart: unless-stopped

  scheduler:
    <<: *app-image
    container_name: usaharumahan-scheduler
    command: php artisan schedule:work
    restart: unless-stopped

  inertia-ssr:
    <<: *app-image
    container_name: usaharumahan-ssr
    command: php artisan inertia:start-ssr
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: usaharumahan-postgres
    environment:
      POSTGRES_DB: usaharumahan
      POSTGRES_USER: usaharumahan
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - usaharumahan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usaharumahan -d usaharumahan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: usaharumahan-redis
    ports:
      - "6380:6379"
    volumes:
      - usaharumahan-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: usaharumahan-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: usaharumahan
      MINIO_ROOT_PASSWORD: secret-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - usaharumahan-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: usaharumahan-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 usaharumahan secret-secret-key &&
      mc mb -p local/usaharumahan &&
      mc anonymous set download local/usaharumahan/public
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: usaharumahan-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  usaharumahan-postgres-data:
  usaharumahan-redis-data:
  usaharumahan-minio-data:
